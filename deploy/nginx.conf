# This vhost owns only reelsup.store. Keep the existing sites untouched.
# Cloudflare ranges verified from https://www.cloudflare.com/ips/ on 2026-11-17.
server {
    listen 80;
    server_name reelsup.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lock-gold-free-acme;
    }
    location / {
        return 308 https://reelsup.store$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name reelsup.store;
    ssl_certificate /etc/letsencrypt/live/reelsup.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reelsup.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:LockGoldTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Cache-Control "no-transform" always;
    access_log /var/log/nginx/lock-gold-free.access.log;
    error_log /var/log/nginx/lock-gold-free.error.log;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 65m;
    client_body_timeout 60s;
    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host reelsup.store;
        proxy_set_header X-Forwarded-Host reelsup.store;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
    }
}
