purpose:
  stands_in_for: Locket private API and Firebase endpoints used by locket.js 0.0.3.
  unblocks: Local adapter and browser checks without real passwords, posts or messages.
assumptions:
  - id: sdk-envelope-contract
    status: unknown
    claim: The live provider accepts the request shapes and returns the result envelopes assumed by locket.js 0.0.3.
    reason: Fixtures are derived from the installed SDK source. No official contract or live credentials were available. Published mock discovery was skipped because the Postman CLI is signed out.
    verification: Local SDK HTTP integration and 112 browser checks passed against local fixtures, including controlled upstream errors. Caller behavior is verified; live interoperability remains unverified.
    source: node_modules/locket.js/lib/client.js; postman/mocks/locket/default.cjs; tests/sdk.test.js
    updated_at: "2026-11-16"
  - id: free-plan-media
    status: unknown
    claim: A free Locket account can successfully post every media and caption variant exposed by the SDK.
    reason: No real account has been used. The website does not claim to activate Gold subscriptions.
    verification: Not tested against live Locket.
    source: docs/spec.md; shared/operations.js
    updated_at: "2026-11-16"
  - id: canonical-id-is-history-cursor
    status: unknown
    claim: Passing the last canonical_uid as getLatestMomentV2 sync_token retrieves older shared moments for a real account.
    reason: The pinned SDK uses this loop, but its source is not a provider contract. The operator still reported a single accessible moment after the prior fixture-verified repair. Consumer browsing now uses the SDK history query with its explicit date/document cursor instead.
    verification: Source inspected and local continuation fixtures exercised; no authenticated live provider read was performed. Prior passing fixtures do not establish older-history availability.
    source: node_modules/locket.js/lib/modules/moments.js; docs/plans/reels-feed.md; tests/sdk.test.js
    updated_at: "2026-11-17"
  - id: history-preserves-real-author
    status: contradicted
    claim: The pinned SDK getMoments mapper preserves the original user field of unfiltered history entries.
    reason: locket.js 0.0.3 discards fields.user and substitutes the account UID. The consumer adapter reuses the query/parser/cursor while preserving the original author and leaving missing authors unknown.
    verification: Real installed SDK over controlled HTTP reproduced the wrong owner; adapter transport checks recovered actual authors and validated account-scoped continuation. This establishes local mapping behavior, not the completeness of live history.
    source: tests/sdk.test.js; server/services/locket/client.js; node_modules/locket.js/lib/modules/moments.js
    updated_at: "2026-11-17"
